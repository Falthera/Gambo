name: Gambo Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  Linux:
    name: Linux release build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install GCC 11
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 11

      - name: Install coreutils (for timeout on macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Download the used network from the fishtest framework
        run: |
          echo "Downloading network..."
          make net 2>&1
          echo "Network download complete"
          ls -la nn-*.nnue 2>/dev/null || echo "No network file found"

      - name: Build release binary
        run: |
          set -e
          make clean
          timeout 600 make -j4 profile-build ARCH=x86-64-bmi2 COMP=gcc EXE=gambi
          make strip ARCH=x86-64-bmi2 COMP=gcc EXE=gambi
          ls -la gambi
          cp gambi ../gambo-linux-x86-64-bmi2

      - name: Package release files
        run: |
          cd ..
          mkdir gambi-release
          cp gambi-linux-x86-64-bmi2 gambi-release/
          cp README.md gambi-release/
          cp Copying.txt gambi-release/
          cp AUTHORS gambi-release/
          cp CITATION.cff gambi-release/
          cp "Top CPU Contributors.txt" gambi-release/
          cp CONTRIBUTING.md gambi-release/
          tar -czf gambi-linux-x86-64-bmi2.tar.gz gambi-release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: gambi-linux-x86-64-bmi2.tar.gz

  Windows:
    name: Windows release build
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
        working-directory: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup msys and install required packages
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc make git zip

      - name: Download the used network from the fishtest framework
        run: |
          echo "Downloading network..."
          make net 2>&1
          echo "Network download complete"
          ls -la nn-*.nnue 2>/dev/null || echo "No network file found"

      - name: Build release binary
        run: |
          set -e
          make clean
          echo "Building Windows binary with mingw..."
          # Use cmd.exe for the bench step to avoid MSYS2 bash hang
          make -j4 profile-build ARCH=x86-64-bmi2 COMP=mingw EXE=gambi.exe RUN_PREFIX="cmd.exe /c"
          make strip ARCH=x86-64-bmi2 COMP=mingw EXE=gambi.exe
          ls -la gambi.exe
          cp gambi.exe ../gambo-windows-x86-64-bmi2.exe

      - name: Package release files
        run: |
          cd ..
          mkdir gambi-release
          cp gambi-windows-x86-64-bmi2.exe gambi-release/
          cp README.md gambi-release/
          cp Copying.txt gambi-release/
          cp AUTHORS gambi-release/
          cp CITATION.cff gambi-release/
          cp "Top CPU Contributors.txt" gambi-release/
          cp CONTRIBUTING.md gambi-release/
          zip -r gambi-windows-x86-64-bmi2.zip gambi-release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: gambi-windows-x86-64-bmi2.zip

  MacOS:
    name: macOS release build
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install coreutils (for timeout on macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Download the used network from the fishtest framework
        run: |
          echo "Downloading network..."
          make net 2>&1
          echo "Network download complete"
          ls -la nn-*.nnue 2>/dev/null || echo "No network file found"

      - name: Build release binary
        run: |
          set -e
          make clean
          gtimeout 600 make -j4 profile-build ARCH=x86-64-bmi2 COMP=clang EXE=gambi
          make strip ARCH=x86-64-bmi2 COMP=clang EXE=gambi
          ls -la gambi
          cp gambi ../gambo-macos-x86-64-bmi2

      - name: Package release files
        run: |
          cd ..
          mkdir gambi-release
          cp gambi-macos-x86-64-bmi2 gambi-release/
          cp README.md gambi-release/
          cp Copying.txt gambi-release/
          cp AUTHORS gambi-release/
          cp CITATION.cff gambi-release/
          cp "Top CPU Contributors.txt" gambi-release/
          cp CONTRIBUTING.md gambi-release/
          tar -czf gambi-macos-x86-64-bmi2.tar.gz gambi-release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: gambi-macos-x86-64-bmi2.tar.gz

  Release:
    name: Publish GitHub Release
    needs: [Linux, Windows, MacOS]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create release tag
        run: |
          TAG="release-gambo-${GITHUB_SHA::8}"
          git fetch --tags
          if git show-ref --tags --quiet --verify "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gambo Release ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
